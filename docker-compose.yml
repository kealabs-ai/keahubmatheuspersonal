services:
  users-service:
    image: matheuspersonal/users:latest
    environment:
      DB_HOST: ${DB_HOST_MP}
      DB_PORT: ${DB_PORT_MP}
      DB_NAME: ${DB_NAME_MP}
      DB_USER: ${DB_USER_MP}
      DB_PASSWORD: ${DB_PASSWORD_MP}
      DB_POOL_SIZE: ${DB_POOL_SIZE_MP}
      JWT_SECRET: ${JWT_SECRET}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mp-users.rule=(Host(`srv1023256.hstgr.cloud`) || Host(`matheuspersonal.com.br`) || Host(`www.matheuspersonal.com.br`)) && PathPrefix(`/api/users`)"
      - "traefik.http.routers.mp-users.entrypoints=https"
      - "traefik.http.routers.mp-users.tls=true"
      - "traefik.http.middlewares.mp-strip-users.stripprefix.prefixes=/api"
      - "traefik.http.middlewares.mp-cors.headers.accesscontrolalloworiginlist=https://www.matheuspersonal.com.br,https://matheuspersonal.com.br,https://srv1023256.hstgr.cloud,http://localhost:5173"
      - "traefik.http.middlewares.mp-cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS"
      - "traefik.http.middlewares.mp-cors.headers.accesscontrolallowheaders=Content-Type,Authorization,Accept,X-Requested-With"
      - "traefik.http.middlewares.mp-cors.headers.accesscontrolmaxage=86400"
      - "traefik.http.middlewares.mp-cors.headers.addvaryheader=true"
      - "traefik.http.middlewares.mp-cors.headers.accesscontrolallowcredentials=true"
      - "traefik.http.routers.mp-users.middlewares=mp-strip-users,mp-cors"
      - "traefik.http.services.mp-users.loadbalancer.server.port=8000"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - easypanel

