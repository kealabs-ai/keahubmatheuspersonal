services:
  users-service:
    build: ./services/users
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    restart: always
    networks:
      - matheuspersonal

  subscriptions-service:
    build: ./services/subscriptions
    ports:
      - "8002:8000"
    env_file:
