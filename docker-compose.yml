services:
  users-service:
    image: matheuspersonal/users:latest
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.mp-users.rule=Host(`srv1023256.hstgr.cloud`) && PathPrefix(`/api/users`)"
        - "traefik.http.routers.mp-users.entrypoints=https"
        - "traefik.http.routers.mp-users.tls=true"
        - "traefik.http.middlewares.mp-users-strip.stripprefix.prefixes=/api/users"
        - "traefik.http.routers.mp-users.middlewares=mp-users-strip"
        - "traefik.http.services.mp-users.loadbalancer.server.port=8000"
    networks:
      - matheuspersonal
      - easypanel

