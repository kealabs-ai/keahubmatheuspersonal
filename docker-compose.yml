services:
  users-service:
    image: matheuspersonal/users:latest
    environment:
      DB_HOST: srv1078.hstgr.io
      DB_PORT: "3306"
      DB_NAME: u549746795_mp
      DB_USER: u549746795_matheusmp
      DB_PASSWORD: MP@2026!Passos
      JWT_SECRET: your-secret-key-change-in-production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mp-users.rule=(Host(`srv1023256.hstgr.cloud`) || Host(`matheuspersonal.com.br`) || Host(`www.matheuspersonal.com.br`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.mp-users.entrypoints=https"
      - "traefik.http.routers.mp-users.tls=true"
      - "traefik.http.middlewares.mp-strip-users.stripprefix.prefixes=/api"
      - "traefik.http.middlewares.mp-cors.headers.accesscontrolalloworiginlist=*"
      - "traefik.http.middlewares.mp-cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS"
      - "traefik.http.middlewares.mp-cors.headers.accesscontrolallowheaders=Content-Type,Authorization"
      - "traefik.http.middlewares.mp-cors.headers.accesscontrolmaxage=1728000"
      - "traefik.http.middlewares.mp-cors.headers.addvaryheader=true"
      - "traefik.http.routers.mp-users.middlewares=mp-strip-users,mp-cors"
      - "traefik.http.services.mp-users.loadbalancer.server.port=8000"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - easypanel

